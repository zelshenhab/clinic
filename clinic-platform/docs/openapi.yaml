          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
        action_kind:
          anyOf:
            - type: string
              enum:
                - doctors
                - services
                - specialties
            - type: "null"
        active:
          type: boolean
        sort_order:
          type: integer
          minimum: 0
          maximum: 10000
      additionalProperties: false
    AdminPage:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            type: object
        pagination:
          $ref: "#/components/schemas/Pagination"
    Availability:
      type: array
      items:
        type: object
        required:
          - starts_at
          - ends_at
        properties:
          starts_at:
            type: string
            format: date-time
          ends_at:
            type: string
            format: date-time
    PatientCancel:
      type: object
      additionalProperties: false
      required:
        - status
        - expected_updated_at
      properties:
        status:
          const: cancelled
        expected_updated_at:
          type: string
          format: date-time
    DoctorStatusChange:
      type: object
      additionalProperties: false
      properties:
        clinic_id: *a3
        status:
          type: string
          enum:
            - completed
            - no_show
        expected_updated_at: *a4
      required:
        - clinic_id
        - status
        - expected_updated_at
    DoctorChangeRequest:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            clinic_id: *a3
            kind:
              type: string
              const: schedule
            reason: &a10
              type: string
              minLength: 5
              maxLength: 2000
            payload:
              $ref: "#/components/schemas/AdminSchedule"
          required:
            - clinic_id
            - kind
            - reason
            - payload
        - type: object
          additionalProperties: false
          properties:
            clinic_id: *a3
            kind:
              type: string
              const: day_off
            reason: *a10
            payload: &a11
              type: object
              additionalProperties: false
              properties:
                starts_at: *a4
                ends_at: *a4
              required:
                - starts_at
                - ends_at
          required:
            - clinic_id
            - kind
            - reason
            - payload
        - type: object
          additionalProperties: false
          properties:
            clinic_id: *a3
            kind:
              type: string
              const: vacation
            reason: *a10
            payload: *a11
          required:
            - clinic_id
            - kind
            - reason
            - payload
        - type: object
          additionalProperties: false
          properties:
            clinic_id: *a3
            kind:
              type: string
              const: reschedule
            reason: *a10
            payload:
              type: object
              additionalProperties: false
              properties:
                appointment_id: *a3
                starts_at: *a4
                expected_updated_at: *a4
              required:
                - appointment_id
                - starts_at
                - expected_updated_at
          required:
            - clinic_id
            - kind
            - reason
            - payload
      description: Requests never alter schedules or appointments immediately. Clinic administrator approval
        revalidates conflicts; schedule requests preserve a baseline to detect intervening edits.
    DoctorRequestReview:
      type: object
      additionalProperties: false
      properties:
        approve:
          type: boolean
        note:
          type: string
          maxLength: 2000
          default: ""
      required:
        - approve
    BookingPolicy:
      type: object
      additionalProperties: false
      properties:
        cancellation_notice_minutes:
          type: integer
          minimum: 0
          maximum: 10080
        reschedule_notice_minutes:
          type: integer
          minimum: 0
          maximum: 10080
      required:
        - cancellation_notice_minutes
        - reschedule_notice_minutes
  responses:
    Failure:
      description: Sanitized error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
