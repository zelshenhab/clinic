name: clinic_mobile
description: Multi-clinic medical platform
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  dio: ^5.9.0
  get_it: ^9.3.0
  go_router: ^17.5.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.3
  intl: any
  supabase_flutter: ^2.18.2
  flutter_svg: ^2.3.0
  timezone: ^0.11.1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  http: ^1.6.0
  fake_async: ^1.3.3
flutter:
  assets:
    - assets/images/clinic.svg
    - assets/images/doctor.svg
    - assets/images/banner.svg
  uses-material-design: true
  generate: true
