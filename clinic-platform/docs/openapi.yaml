  /api/v1/doctor/schedule/block:
    post:
      tags:
        - Patient experience
      summary: Block a day or vacation period for the signed-in doctor
      description: Future non-empty interval, maximum 180 days. Existing active
        appointments are protected and produce SCHEDULE_CONFLICT (409). No
        caller doctor ID accepted.
      security:
        - bearerAuth: []
      parameters: []
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
