name: Platform checks
on: [push, pull_request]
jobs:
  javascript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clinic-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: clinic-platform/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
        working-directory: clinic-platform/apps/mobile
      - run: flutter analyze
        working-directory: clinic-platform/apps/mobile
      - run: flutter test
        working-directory: clinic-platform/apps/mobile
