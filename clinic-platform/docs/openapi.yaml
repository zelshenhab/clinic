openapi: 3.1.0
info:
  title: Clinic Platform API
  version: 0.6.0
servers:
  - url: http://localhost:3000
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Process liveness, not database readiness
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
      security: []
  /api/v1/clinics:
    get:
      summary: Active public clinics
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
      security: []
  /api/v1/clinics/{clinicId}:
    get:
      summary: Public clinic information
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
      security: []
      parameters:
        - name: clinicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
  /api/v1/clinics/{clinicId}/settings:
    get:
      summary: Public clinic settings
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
      security: []
      parameters:
        - name: clinicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
  /api/v1/clinics/{clinicId}/doctors:
    get:
      summary: Clinic doctors
      description: Only active public catalog records in the selected clinic. Lists return data.items plus
        pagination; prices are RUB. Promotion reads include only active time-window records. Strict queries
        reject unknown parameter names. Name search matches RU and EN; locale controls name sorting. featured
        sorting uses configured sort_order; it does not remove non-featured list rows.
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - message
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/DoctorPage"
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/Failure"
        "404":
          $ref: "#/components/responses/Failure"
        "429":
          $ref: "#/components/responses/Failure"
        "500":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
      parameters:
        - name: clinicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
            default: ""
        - name: specialtyId
          in: query
          schema:
            type: string
            format: uuid
        - name: serviceId
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 12
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - featured
              - name
              - price_asc
              - price_desc
              - experience_desc
            default: featured
        - name: locale
          in: query
          schema:
            type: string
            enum:
              - ru
              - en
            default: ru
      security: []
  /api/v1/clinics/{clinicId}/specialties:
    get:
      summary: Clinic specialties
      description: Only active public catalog records in the selected clinic. Lists return data.items plus
        pagination; prices are RUB. Promotion reads include only active time-window records. Strict queries
        reject unknown parameter names. Name search matches RU and EN; locale controls name sorting. featured
        sorting uses configured sort_order; it does not remove non-featured list rows.
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - message
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/SpecialtyPage"
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/Failure"
        "404":
          $ref: "#/components/responses/Failure"
        "429":
          $ref: "#/components/responses/Failure"
        "500":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
      parameters:
        - name: clinicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
            default: ""
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 12
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - featured
              - name
              - price_asc
              - price_desc
              - experience_desc
            default: featured
        - name: locale
          in: query
          schema:
            type: string
            enum:
              - ru
              - en
            default: ru
      security: []
  /api/v1/auth/verify-session:
    post:
      summary: Validate Supabase session
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
  /api/v1/auth/me:
    get:
      summary: Authenticated identity
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
  /api/v1/auth/logout:
    post:
      summary: Revoke current session
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
  /api/v1/admin/clinics/{clinicId}/patients/{patientId}/medical-records:
    get:
      tags:
        - Medical documents
      summary: "Clinic administrator or receptionist lists a patient's documents"
      parameters:
        - name: clinicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "403":
          $ref: "#/components/responses/Failure"
        "404":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
    post:
      tags:
        - Medical documents
      summary: "Upload a document for a clinic patient; the patient is notified"
      parameters:
        - name: clinicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, title, kind]
              properties:
                file: { type: string, format: binary, description: "PDF, JPEG or PNG up to 10 MB; the signature must match the declared type" }
                title: { type: string, minLength: 1, maxLength: 200 }
                kind: { type: string, enum: [report, lab_result, imaging, prescription, other] }
                appointment_id: { type: string, format: uuid, description: "Links the document and inherits its family member" }
                family_member_id: { type: string, format: uuid }
      responses:
        "201":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "403":
          $ref: "#/components/responses/Failure"
        "404":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
  /api/v1/admin/clinics/{clinicId}/medical-records/{id}/download:
    get:
      tags:
        - Medical documents
      summary: "Audited one-minute signed download link"
      parameters:
        - name: clinicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "403":
          $ref: "#/components/responses/Failure"
        "404":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
  /api/v1/admin/clinics/{clinicId}/medical-records/{id}:
    delete:
      tags:
        - Medical documents
      summary: "Archive a document; the patient no longer sees it"
      parameters:
        - name: clinicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "403":
          $ref: "#/components/responses/Failure"
        "404":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
  /api/v1/doctor/patients/{id}/medical-records:
    get:
      tags:
        - Medical documents
      summary: "Doctor lists documents of a patient they have an appointment with"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: clinic_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "403":
          $ref: "#/components/responses/Failure"
        "404":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
    post:
      tags:
        - Medical documents
      summary: "Doctor uploads a document for their own patient"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: clinic_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, title, kind]
              properties:
                file: { type: string, format: binary, description: "PDF, JPEG or PNG up to 10 MB; the signature must match the declared type" }
                title: { type: string, minLength: 1, maxLength: 200 }
                kind: { type: string, enum: [report, lab_result, imaging, prescription, other] }
                appointment_id: { type: string, format: uuid, description: "Links the document and inherits its family member" }
                family_member_id: { type: string, format: uuid }
      responses:
        "201":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "403":
          $ref: "#/components/responses/Failure"
        "404":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
  /api/v1/doctor/medical-records/{id}/download:
    get:
      tags:
        - Medical documents
      summary: "Audited signed download for the doctor's own patient"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: clinic_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "403":
          $ref: "#/components/responses/Failure"
        "404":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
  /api/v1/doctor/medical-records/{id}:
    delete:
      tags:
        - Medical documents
      summary: "Doctor archives a document they uploaded"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: clinic_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "403":
          $ref: "#/components/responses/Failure"
        "404":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
  /api/v1/clinics/{clinicId}/medical-records:
    get:
      tags:
        - Medical documents
      summary: "Verified patient lists own and family members' documents in this clinic"
      parameters:
        - name: clinicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
  /api/v1/clinics/{clinicId}/medical-records/{id}/download:
    get:
      tags:
        - Medical documents
      summary: "Verified patient receives a one-minute signed download link"
      parameters:
        - name: clinicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Failure"
        "404":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
  /api/v1/me/family-members:
    get:
      summary: Active family members of the verified account (max 10)
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
    post:
      summary: Add a family member the account holder can book for
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [full_name, relationship]
              properties:
                full_name: { type: string, minLength: 2, maxLength: 120 }
                relationship: { type: string, enum: [child, spouse, parent, sibling, other] }
                date_of_birth: { type: [string, "null"], format: date, description: Not in the future }
      responses:
        "201":
          description: Created family member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "403":
          $ref: "#/components/responses/Failure"
        "409":
          $ref: "#/components/responses/Failure"
  /api/v1/me/family-members/{id}:
    patch:
      summary: Update an own active family member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [full_name, relationship]
              properties:
                full_name: { type: string, minLength: 2, maxLength: 120 }
                relationship: { type: string, enum: [child, spouse, parent, sibling, other] }
                date_of_birth: { type: [string, "null"], format: date, description: Not in the future }
      responses:
        "200":
          description: Updated family member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "404":
          $ref: "#/components/responses/Failure"
    delete:
      summary: Archive an own family member; past appointments keep their attribution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "404":
          $ref: "#/components/responses/Failure"
  /api/v1/me/profile:
    get:
      summary: Current patient profile, null before completion
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
    patch:
      summary: Create or update the verified patient profile
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - full_name
              properties:
                full_name:
                  type: string
                  minLength: 2
                  maxLength: 120
                email:
                  type:
                    - string
                    - "null"
                  format: email
                language:
                  type: string
                  enum:
                    - ru
                    - en
  /api/v1/me/appointments:
    get:
      summary: Current patient appointments in the selected clinic
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
      parameters:
        - name: clinic_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
  /api/v1/clinics/{clinicId}/doctors/{doctorId}:
    get:
      summary: Clinic doctor detail
      description: Related records are bounded paginated collections. Schedule overview is not appointment
        availability. Clinic-specific assignment metadata and service prices are used.
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - message
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/DoctorDetail"
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/Failure"
        "404":
          $ref: "#/components/responses/Failure"
        "429":
          $ref: "#/components/responses/Failure"
        "500":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
      parameters:
        - name: clinicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: doctorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 12
        - name: locale
          in: query
          schema:
            type: string
            enum:
              - ru
              - en
            default: ru
      security: []
  /api/v1/clinics/{clinicId}/specialties/{specialtyId}:
    get:
      summary: Clinic specialty detail
      description: Related records are bounded paginated collections. Schedule overview is not appointment
        availability. Clinic-specific assignment metadata and service prices are used.
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - message
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/SpecialtyDetail"
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/Failure"
        "404":
          $ref: "#/components/responses/Failure"
        "429":
          $ref: "#/components/responses/Failure"
        "500":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
      parameters:
        - name: clinicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: specialtyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 12
        - name: locale
          in: query
          schema:
            type: string
            enum:
              - ru
              - en
            default: ru
      security: []
  /api/v1/clinics/{clinicId}/services:
    get:
      summary: Clinic services
      description: Only active public catalog records in the selected clinic. Lists return data.items plus
