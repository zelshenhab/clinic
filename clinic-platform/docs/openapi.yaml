                  type: string
                  format: date-time
              required:
                - clinic_id
                - starts_at
                - ends_at
  /api/v1/doctor/schedule/copy:
    post:
      tags:
        - Patient experience
      summary: Replace a future week with copied effective working capacity
      description: Dates normalize to Monday in clinic timezone. Copies working
        intervals minus breaks and closed exceptions plus open exceptions.
        Retains exceptions outside target week, protects active bookings. Future
        target within 180 days, maximum 400 resulting exceptions.
      security:
        - bearerAuth: []
      parameters: []
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "403":
          $ref: "#/components/responses/Failure"
        "404":
          $ref: "#/components/responses/Failure"
        "409":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/Failure"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                clinic_id:
                  type: string
                  format: uuid
                source:
                  type: string
                  format: date
                target:
                  type: string
                  format: date
              required:
                - clinic_id
                - source
                - target
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Success:
      type: object
      required:
        - success
        - data
        - message
      properties:
        success:
          const: true
        data: {}
        message:
          type: string
    Error:
      type: object
      required:
        - success
        - error
      properties:
        success:
          const: false
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
    LocalizedText:
      type: object
      required:
        - ru
        - en
      properties:
        ru:
          type: string
        en:
          type: string
    Clinic:
      type: object
      required:
        - id
        - name
        - address
        - description
        - timezone
        - working_hours
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          $ref: "#/components/schemas/LocalizedText"
        address:
          $ref: "#/components/schemas/LocalizedText"
        description:
          $ref: "#/components/schemas/LocalizedText"
        timezone:
          type: string
        phone:
          type:
            - string
            - "null"
        working_hours:
          type: object
        image_url:
          type:
            - string
            - "null"
          format: uri
        logo_url:
          type:
            - string
            - "null"
          format: uri
    Pagination:
      type: object
      required:
        - page
        - limit
        - total
        - hasMore
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
    SpecialtyReference:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/LocalizedText"
    Specialty:
      type: object
      required:
        - id
        - clinic_id
        - name
        - description
        - icon
        - doctor_count
        - sort_order
      properties:
        id:
          type: string
          format: uuid
        clinic_id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/LocalizedText"
        description:
          $ref: "#/components/schemas/LocalizedText"
        icon:
          type: string
        doctor_count:
          type: integer
          minimum: 0
        sort_order:
          type: integer
    Doctor:
      type: object
      required:
        - id
        - clinic_id
        - name
        - description
        - photo_url
        - professional_title
        - experience_years
        - specialties
        - starting_price_rub
      properties:
        id:
          type: string
          format: uuid
        clinic_id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/LocalizedText"
        description:
          $ref: "#/components/schemas/LocalizedText"
        photo_url:
          type:
            - string
            - "null"
          format: uri
        professional_title:
          $ref: "#/components/schemas/LocalizedText"
        experience_years:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 80
        specialties:
          type: array
          items:
            $ref: "#/components/schemas/SpecialtyReference"
        starting_price_rub:
          type:
            - number
            - "null"
          minimum: 0
    Service:
      type: object
      required:
        - id
        - clinic_id
        - specialty_id
        - specialty_name
        - name
        - description
        - price_rub
        - duration_minutes
        - category_key
        - category
      properties:
        id:
          type: string
          format: uuid
        clinic_id:
          type: string
          format: uuid
        specialty_id:
          type: string
          format: uuid
        specialty_name:
          $ref: "#/components/schemas/LocalizedText"
        name:
          $ref: "#/components/schemas/LocalizedText"
        description:
          $ref: "#/components/schemas/LocalizedText"
        price_rub:
          type: number
          minimum: 0
        duration_minutes:
          type: integer
          minimum: 5
          maximum: 480
        category_key:
          type: string
        category:
          $ref: "#/components/schemas/LocalizedText"
    Promotion:
      type: object
      required:
        - id
        - clinic_id
        - title
        - description
        - image_url
        - action_kind
        - starts_at
        - ends_at
      properties:
        id:
          type: string
          format: uuid
        clinic_id:
          type: string
          format: uuid
        title:
          $ref: "#/components/schemas/LocalizedText"
        description:
          $ref: "#/components/schemas/LocalizedText"
        image_url:
          type:
            - string
            - "null"
          format: uri
        action_kind:
          type:
            - string
            - "null"
          enum:
            - doctors
            - specialties
            - services
            - null
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
    Category:
      type: object
      required:
        - category_key
        - category
      properties:
        category_key:
          type: string
        category:
          $ref: "#/components/schemas/LocalizedText"
    DoctorPage:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Doctor"
        pagination:
          $ref: "#/components/schemas/Pagination"
    SpecialtyPage:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Specialty"
        pagination:
          $ref: "#/components/schemas/Pagination"
    ServicePage:
      type: object
      required:
        - items
        - pagination
        - categories
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        pagination:
          $ref: "#/components/schemas/Pagination"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    PromotionPage:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Promotion"
        pagination:
          $ref: "#/components/schemas/Pagination"
    Schedule:
      type: object
      required:
        - weekday
        - starts_at
        - ends_at
        - breaks
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Sunday; all times are clinic-local wall-clock values.
        starts_at:
          type: string
        ends_at:
          type: string
        breaks:
          type: array
          items:
            type: object
            required:
              - start
              - end
            properties:
              start:
                type: string
              end:
                type: string
    DoctorDetail:
      allOf:
        - $ref: "#/components/schemas/Doctor"
        - type: object
          required:
            - clinic
            - education
            - biography
            - qualifications
            - languages
            - services
            - schedules
          properties:
            clinic:
              $ref: "#/components/schemas/Clinic"
            education:
              $ref: "#/components/schemas/LocalizedText"
            biography:
              $ref: "#/components/schemas/LocalizedText"
            qualifications:
              $ref: "#/components/schemas/LocalizedText"
            languages:
              type: array
              items:
                type: string
            services:
              $ref: "#/components/schemas/ServicePage"
            schedules:
              type: array
              items:
                $ref: "#/components/schemas/Schedule"
    SpecialtyDetail:
      allOf:
        - $ref: "#/components/schemas/Specialty"
        - type: object
          required:
            - doctors
            - services
          properties:
            doctors:
              $ref: "#/components/schemas/DoctorPage"
            services:
              $ref: "#/components/schemas/ServicePage"
    ServiceDetail:
      allOf:
        - $ref: "#/components/schemas/Service"
        - type: object
          required:
            - clinic
            - doctors
          properties:
            clinic:
              $ref: "#/components/schemas/Clinic"
            doctors:
              $ref: "#/components/schemas/DoctorPage"
    Home:
      type: object
      required:
        - clinic
        - promotions
        - specialties
        - doctors
        - services
      properties:
        clinic:
          $ref: "#/components/schemas/Clinic"
        promotions:
          type: array
          items:
            $ref: "#/components/schemas/Promotion"
          maxItems: 4
        specialties:
          type: array
          items:
            $ref: "#/components/schemas/Specialty"
          maxItems: 6
        doctors:
          type: array
          items:
            $ref: "#/components/schemas/Doctor"
          maxItems: 3
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
          maxItems: 4
    BookingContext:
      type: object
      required:
        - clinic
        - doctor
        - service
        - specialty
        - online_booking_enabled
      properties:
        clinic:
          $ref: "#/components/schemas/Clinic"
        doctor:
          anyOf:
            - $ref: "#/components/schemas/Doctor"
            - type: "null"
        service:
          anyOf:
            - $ref: "#/components/schemas/Service"
            - type: "null"
        specialty:
          anyOf:
            - $ref: "#/components/schemas/Specialty"
            - type: "null"
        online_booking_enabled:
          type: boolean
          const: true
    Notification:
      type: object
      required:
        - id
        - clinic_id
        - title
        - body
        - created_at
        - read_at
      properties:
        id:
          type: string
          format: uuid
        clinic_id:
          type: string
          format: uuid
        title:
          $ref: "#/components/schemas/LocalizedText"
        body:
          $ref: "#/components/schemas/LocalizedText"
        created_at:
          type: string
          format: date-time
        read_at:
          type:
            - string
            - "null"
          format: date-time
    AdminBook:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        patient_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        doctor_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        service_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        starts_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
      required:
        - patient_id
        - doctor_id
        - service_id
        - starts_at
      additionalProperties: false
    AdminChange:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        expected_updated_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
        status:
          type: string
          enum:
            - confirmed
            - completed
            - cancelled
            - no_show
        starts_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
      required:
        - expected_updated_at
      additionalProperties: false
    AdminSchedule:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        weekly:
          maxItems: 168
          type: array
          items:
            type: object
            properties:
              weekday:
                type: integer
                minimum: 0
                maximum: 6
              starts_at:
                type: string
                pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
              ends_at:
                type: string
                pattern: ^(?:(?:[01][0-9]|2[0-3]):[0-5][0-9]|24:00)$
                description: Exclusive end time. 24:00 means midnight at the end of this weekday.
              breaks:
                maxItems: 8
                type: array
                items:
                  type: object
                  properties:
                    start:
                      type: string
                      pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
                    end:
                      type: string
                      pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
                  required:
                    - start
                    - end
                  additionalProperties: false
            required:
              - weekday
              - starts_at
              - ends_at
              - breaks
            additionalProperties: false
        exceptions:
          maxItems: 100
          type: array
          items:
            type: object
            properties:
              starts_at:
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
              ends_at:
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
              available:
                type: boolean
            required:
              - starts_at
              - ends_at
              - available
            additionalProperties: false
      required:
        - weekly
        - exceptions
      additionalProperties: false
    AdminSettings:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        name:
          type: object
          properties:
            ru:
              type: string
              minLength: 2
              maxLength: 200
            en:
              type: string
              minLength: 2
              maxLength: 200
